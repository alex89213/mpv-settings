# Additions to mpv's default bindings. Every default binding is left intact,
# so anything learned from stock mpv still works here. The keys used below
# (B, h, H, Ctrl+f, Ctrl+i, Ctrl+t, Ctrl+o) are unbound in mpv's builtin
# input.conf.
#
# Related defaults worth knowing, which this file deliberately does not touch:
#   i / I    stats overlay
#   b        toggle debanding on/off (B below cycles its strength)
#   Ctrl+h   cycle hwdec between no and auto

# cycle deband strength, press b first since debanding starts off
B cycle-values deband-iterations "2" "3" "4" ; cycle-values deband-threshold "35" "45" "60" ; cycle-values deband-range "20" "25" "30" ; cycle-values deband-grain "5" "15" "30" ; show-text "Deband: ${deband-iterations}:${deband-threshold}:${deband-range}:${deband-grain}"

# audio track selection
h cycle audio
H cycle audio down

# drop to mpv's fast profile for integrated graphics or battery, and back
Ctrl+f script-binding toggle-video-quality

# toggles video-sync and interpolation together, since interpolation alone does
# nothing without a display-sync mode
Ctrl+i script-binding toggle-motion-smooth

# open the console with a seek command ready for a timestamp
Ctrl+t script-message-to console type "set time-pos "

Ctrl+o cycle-values tone-mapping "spline" "bt.2446a" "st2094-40" ; show-text "Tone-mapping: ${tone-mapping}"
