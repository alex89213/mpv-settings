# mpv configuration. Options matching mpv's defaults are left out unless noted.
# Profiles must stay at the bottom, since every line after a [name] header
# belongs to that profile.

# =========================
# GENERAL / PLAYBACK
# =========================
force-seekable=yes
keep-open=yes  # stop at the end of the last file, still advance through the playlist
resume-playback=no
autocreate-playlist=same
#log-file=~~/mpv-log.txt  # verbose log, overwritten every run

# =========================
# CACHE / DEMUXER
# =========================
cache=yes  # the default "auto" skips local files
cache-secs=300  # only limits audio-only files, video hits demuxer-max-bytes first
demuxer-max-back-bytes=1G  # back buffer for instant rewinds, fills as you play
demuxer-max-bytes=300M  # readahead, raise it for network shares

# =========================
# VIDEO OUTPUT / RENDERING
# =========================
vo=gpu-next
profile=high-quality  # Ctrl+f switches to fast
#profile=fast
dscale=catmull_rom
#gpu-api=vulkan
hwdec=auto

# =========================
# HDR / COLOR
# =========================
tone-mapping=spline
# keep the per-frame peak from drifting mid-scene (defaults are 20, 1.0, 3.0)
hdr-peak-decay-rate=100
hdr-scene-threshold-low=2.0
hdr-scene-threshold-high=6.0

# =========================
# DEBANDING
# =========================
# off by default, b toggles it and B cycles these strength presets
deband-iterations=2
deband-threshold=35
deband-range=20
deband-grain=5

# =========================
# MOTION / INTERPOLATION
# =========================
# off by default, Ctrl+i turns it on through the [motion-smooth] profile
tscale=sphinx
tscale-blur=0.699
tscale-radius=1.0

# =========================
# AUDIO
# =========================
volume=50
volume-max=200
alang=en,eng
audio-file-auto=fuzzy
audio-normalize-downmix=yes  # keeps dialogue audible when 5.1/7.1 is folded to stereo
replaygain=track  # "album" keeps relative levels within an album

# =========================
# SUBTITLES
# =========================
slang=en,eng
sub-auto=fuzzy

# styling only reaches plain-text subtitles like SRT. ASS/SSA keep their own
sub-font='Geist Medium'
#sub-font='Literata Medium'  # serif, more like a book
sub-font-size=60
sub-color='#F2F0EF'
sub-outline-color='#3B3430'
sub-outline-size=1
sub-scale-with-window=no

blend-subtitles=yes  # tone maps subs with HDR video, but keeps them out of the black bars
sub-use-margins=no  # redundant while blend-subtitles is on
sub-fix-timing=no  # already the default, older versions defaulted to yes

# =========================
# OSD
# =========================
osd-bar=no
osd-align-x=right
osd-font-size=24
osd-font='Geist SemiBold'
osd-outline-size=1
osd-color='#CCFFFFFF'

# =========================
# SCREENSHOTS
# =========================
# the template needs quotes because an unquoted value starting with % fails to
# parse. %X{.} saves next to the video, falling back to screenshot-dir
screenshot-template="%X{.}/Screenshots/Screenshot-%F-T%wH.%wM.%wS.%wT-F%{estimated-frame-number}"
screenshot-dir=~~desktop/
screenshot-format=png
screenshot-png-compression=1  # still lossless, just faster than the default

# =========================
# PROFILES
# =========================
# toggled by scripts/profile-toggle.lua. profile-restore=copy lets
# "apply-profile <name> restore" put back the previous values

[video-fast]  # Ctrl+f
profile-restore=copy
profile=fast
scale-antiring=0  # undo high-quality extras that fast leaves alone
hdr-contrast-recovery=0

[motion-smooth]  # Ctrl+i, interpolation needs a display-sync mode to work
profile-restore=copy
video-sync=display-resample
interpolation=yes
