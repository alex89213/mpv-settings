# mpv configuration. Options are grouped by what they affect, and anything
# identical to mpv's own default is left out unless there is a reason to pin it
# (noted inline where that happens). Profile definitions must stay at the very
# bottom of this file, because every line after a [name] header belongs to it.

# =========================
# GENERAL / PLAYBACK
# =========================
force-seekable=yes

# stay open at the end of the last file, but still advance through the playlist
# ("always" would stop after every file)
keep-open=yes

resume-playback=no
autocreate-playlist=same

# uncomment to log each run to portable_config/mpv-log.txt. mpv forces at least
# -v -v for this file, so it grows fast and is overwritten every run
#log-file=~~/mpv-log.txt

# =========================
# CACHE / DEMUXER
# =========================
# required for the back buffer below to do anything on local files, since the
# "auto" default only caches network or other slow media
cache=yes

# a cap, not a target. mpv's default is far higher, and demuxer-max-bytes is
# reached first for video, so this only limits audio-only readahead
cache-secs=300

# how far back seeking works without re-reading, around 2.5 minutes on a
# 58 Mbps remux and 10 on a 13 Mbps encode. fills during playback, not reserved
demuxer-max-back-bytes=1G

# forward readahead, deliberately modest. local playback needs roughly 7 MB/s
# and an SSD delivers hundreds. raise it for playback over a network share
demuxer-max-bytes=300M

# =========================
# VIDEO OUTPUT / RENDERING
# =========================
vo=gpu-next

# press Ctrl+f to switch to fast at runtime
profile=high-quality
#profile=fast

dscale=catmull_rom
#gpu-api=vulkan

# mpv defaults to no hardware decoding
hwdec=auto

# =========================
# HDR / COLOR
# =========================
tone-mapping=spline

# per-frame peak detection is already mpv's default where compute shaders work,
# and the high-quality profile sets hdr-peak-percentile=99.995. these three keep
# the measured peak from drifting mid-scene: the decay rate defaults to 20 and
# higher settles more slowly, and the thresholds default to 1.0 and 3.0, where
# raising them ignores small changes but still catches real scene cuts
hdr-peak-decay-rate=100
hdr-scene-threshold-low=2.0
hdr-scene-threshold-high=6.0

# =========================
# DEBANDING
# =========================
# debanding is off, mpv's default. these are the strength presets the B key
# cycles through, and mpv's own b key turns debanding on and off
deband-iterations=2
deband-threshold=35
deband-range=20
deband-grain=5

# =========================
# MOTION / INTERPOLATION
# =========================
# interpolation is off, mpv's default, because it needs a display-sync mode and
# the pair costs real CPU and GPU time. Ctrl+i turns both on through the
# [motion-smooth] profile below, and these are the filter it uses once active
tscale=sphinx
tscale-blur=0.699
tscale-radius=1.0

# =========================
# AUDIO
# =========================
volume=50
volume-max=200

# preferred audio languages
alang=en,eng

# pick up external audio whose name only roughly matches the video
audio-file-auto=fuzzy

# keeps dialogue from sitting under the effects when 5.1/7.1 is folded to stereo
audio-normalize-downmix=yes

# even out loudness between files that carry gain tags, which matters most for
# music. "album" instead keeps the relative levels inside an album
replaygain=track

# =========================
# SUBTITLES
# =========================
# preferred subtitle languages
slang=en,eng

# pick up subtitle files whose name only roughly matches the video
sub-auto=fuzzy

# the styling below reaches plain-text subtitles (SRT and similar) only. ASS/SSA
# carry their own styling, which is what anime and most fansubs want, and bitmap
# subtitles (PGS, VOBSUB) are images. use sub-ass-override=force for the first,
# sub-scale and sub-gauss for the second
sub-font='Inter SemiBold'
sub-font-size=50
sub-border-size=1
sub-scale-with-window=no

# draws subtitles into the video before color management, so on HDR content they
# get tone mapped with the image instead of glaring at full signal white, and
# rendering is cheaper while interpolation is on. the cost is that subtitles can
# no longer sit in the black bars. "video" instead rasterizes them at the video's
# resolution, which is cheaper but softens them when upscaling
blend-subtitles=yes

# redundant while blend-subtitles confines subs to the video area. kept so the
# behavior survives if blend-subtitles is ever removed
sub-use-margins=no

# already the default, kept explicit because older mpv versions defaulted to yes
sub-fix-timing=no

# =========================
# OSD
# =========================
osd-bar=no
osd-align-x=right
osd-font-size=24
osd-font='Inter Display Bold'
osd-border-size=1
osd-color='#CCFFFFFF'

# =========================
# SCREENSHOTS
# =========================
# the quotes are required: a value starting with % is read as a length-prefixed
# string, so an unquoted template silently fails to parse. %X{.} puts
# screenshots next to the video, and mpv joins the fallback onto screenshot-dir
screenshot-template="%X{.}/Screenshots/Screenshot-%F-T%wH.%wM.%wS.%wT-F%{estimated-frame-number}"
screenshot-dir=~~desktop/
screenshot-format=png

# png is lossless at every level, 0 only trades much larger files for speed
screenshot-png-compression=1

# =========================
# PROFILES
# =========================
# both profiles below are toggled at runtime from scripts/profile-toggle.lua.
# profile-restore=copy records each option's previous value so that
# "apply-profile <name> restore" puts it back. switching by re-applying
# high-quality would not work, since that profile never sets dither or
# correct-downscaling, so fast's versions of those would stick

# Ctrl+f, cheaper rendering for integrated graphics or battery. the last two
# lines undo the high-quality profile's extra work, which fast leaves alone
[video-fast]
profile-restore=copy
profile=fast
scale-antiring=0
hdr-contrast-recovery=0

# Ctrl+i, smooth out judder from video fps not dividing into the refresh rate.
# both options are needed together, which is why this is a profile and not a
# plain "cycle interpolation" binding
[motion-smooth]
profile-restore=copy
video-sync=display-resample
interpolation=yes
