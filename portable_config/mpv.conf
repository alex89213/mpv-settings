# =========================
# GENERAL / PLAYBACK
# =========================
force-seekable=yes
keep-open=yes                           # stay open at the end of the last file, but
                                        # still advance through the playlist ("always"
                                        # would stop after every file)
resume-playback=no
autocreate-playlist=same
sub-auto=fuzzy                          # pick up subtitle files whose name only
audio-file-auto=fuzzy                   # roughly matches the video
log-file=~~/../mpv-log.txt

# =========================
# CACHE / DEMUXER
# =========================
# Required for the back buffer below to do anything on local files. The "auto"
# default only enables caching for network or other slow media, and
# demuxer-max-back-bytes is documented as useful only when the cache is on.
cache=yes

cache-secs=300                          # a cap, not a target. mpv's default is far
                                        # higher, and demuxer-max-bytes is reached
                                        # first for video, so this only limits
                                        # audio-only readahead.

demuxer-max-back-bytes=1G               # how far back you can seek without re-reading
                                        # and re-demuxing. Around 2.5 minutes on a
                                        # 58 Mbps remux, 10 on a 13 Mbps encode. Fills
                                        # as you watch rather than being reserved.

demuxer-max-bytes=300M                  # forward readahead, deliberately modest: local
                                        # playback needs roughly 7 MB/s and an SSD
                                        # delivers hundreds, so more is not perceptible.
                                        # Raise it for playback over a network share.

# =========================
# VIDEO OUTPUT
# =========================
vo=gpu-next

# =========================
# AUDIO
# =========================
volume=50
volume-max=200
alang=en,eng                            # preferred audio languages
audio-normalize-downmix=yes             # keeps dialogue from sitting under the
                                        # effects when 5.1/7.1 is folded to stereo

# =========================
# SUBTITLES
# =========================
slang=en,eng                            # preferred subtitle languages

# The sub-font/size/color/border options below only apply to plain-text
# subtitles (SRT and similar). ASS/SSA subtitles carry their own styling and
# are left alone, which is what you want for anime and most fansubs. To
# override them anyway, set sub-ass-override=force.
sub-font='Inter SemiBold'
sub-font-size=60
sub-border-size=1
sub-color='#FFFFFF'
blend-subtitles=video                   # improve subtitle performance with interpolation=yes
sub-scale-with-window=no
sub-use-margins=no                      # blend-subtitles already confines subs to the
                                        # video area, so this is currently redundant.
                                        # Kept so the behavior survives if
                                        # blend-subtitles is ever removed.
sub-fix-timing=no                       # already the default. Kept explicit because
                                        # older mpv versions defaulted this to yes.

# =========================
# OSD / OSC
# =========================
osc=yes
osd-bar=no
osd-on-seek=msg                         # the default is "bar", which shows nothing
                                        # at all while osd-bar=no
osd-align-x=right
osd-font-size=24
osd-font='Inter Display Bold'
osd-border-size=1
osd-color='#CCFFFFFF'

# =========================
# VIDEO QUALITY / RENDERING
# =========================
#profile=fast
profile=high-quality                    # press Ctrl+f to switch to fast at runtime
dscale=catmull_rom
#gpu-api=vulkan

# Hardware decoding
hwdec=auto

# Debanding
deband=no
deband-iterations=2
deband-threshold=35
deband-range=20
deband-grain=5

# HDR / color
target-colorspace-hint=yes
tone-mapping=spline

# Measure the peak per-frame rather than trusting the file's static metadata.
# Mastering-display tags describe the whole title, not the scene, and are often
# far higher than anything on screen, which over-compresses darker scenes.
hdr-compute-peak=yes

# These three keep the measured peak from visibly drifting mid-scene, which is
# the usual reason people give up and set hdr-compute-peak=no.
hdr-peak-percentile=99.995              # ignore the brightest 0.005% of pixels, so a
                                        # lone specular highlight cannot drag the
                                        # whole frame darker
hdr-peak-decay-rate=100                 # default 20; higher settles more slowly
hdr-scene-threshold-low=2.0             # defaults 1.0 / 3.0. Raising them stops the
hdr-scene-threshold-high=6.0            # smoothing from snapping on small changes
                                        # while still reacting to real scene cuts

# =========================
# SYNC / SMOOTHING
# =========================
# Off by default because display-resample costs CPU and GPU time. Press Ctrl+i
# to turn both on together: interpolation does nothing on its own, it needs a
# display-sync mode to retime against. See the [motion-smooth] profile below.
video-sync=audio
interpolation=no

# Temporal scaling, i.e. how interpolated frames are blended. These are live
# only while Ctrl+i has smooth motion switched on.
tscale=sphinx
tscale-blur=0.6991556596428412
tscale-radius=1.0
tscale-clamp=0.0

# =========================
# SCREENSHOTS
# =========================

# The quotes are required: mpv.conf treats a value starting with % as a
# length-prefixed string, so an unquoted template silently fails to parse.
# %X{.} puts screenshots next to the video, falling back to screenshot-dir
# for anything not on disk (streams would otherwise land in the drive root).
screenshot-template="%X{.}/Screenshots/Screenshot-%F-T%wH.%wM.%wS.%wT-F%{estimated-frame-number}"
screenshot-dir=~~desktop/
screenshot-format=png
screenshot-png-compression=1            # PNG is lossless at every level; 0 only
                                        # trades much larger files for encode speed
screenshot-tag-colorspace=yes
screenshot-high-bit-depth=yes

# =========================
# PROFILES
# =========================
# Everything below a [name] header belongs to that profile, so profile
# definitions must stay at the end of this file.

# Both profiles below are toggled at runtime from scripts/profile-toggle.lua.
# profile-restore=copy records each option's previous value so that
# "apply-profile <name> restore" puts it back. Switching by re-applying
# high-quality would not work: that profile never sets dither or
# correct-downscaling, so fast's versions of those would stick.

# Ctrl+f: cheaper rendering for integrated graphics or battery.
[video-fast]
profile-restore=copy
profile=fast
scale-antiring=0                        # undo the high-quality profile's
hdr-contrast-recovery=0                 # extra work while in fast mode

# Ctrl+i: smooth out judder from video fps not dividing into the refresh rate.
# Both options are needed together, which is why this is a profile and not a
# plain "cycle interpolation" binding.
[motion-smooth]
profile-restore=copy
video-sync=display-resample
interpolation=yes
